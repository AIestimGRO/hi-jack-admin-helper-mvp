name: Repair shared-IP regression tests

on:
  push:
    branches:
      - fix/jackside-shared-ip-start-limit-clean-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair regression tests
        run: python scripts/repair_shared_ip_regression_tests.py
      - name: Validate patch shape
        run: |
          git diff --check
          git diff --name-only
      - name: Commit repaired tests
        run: |
          git rm .github/workflows/repair-shared-ip-tests.yml
          git rm scripts/repair_shared_ip_regression_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_member_accounts.py tests/test_quiz_v2.py
          git commit -m "test: cover JACKSIDE shared-IP start policy"
          git push origin HEAD:fix/jackside-shared-ip-start-limit-clean-20260915
