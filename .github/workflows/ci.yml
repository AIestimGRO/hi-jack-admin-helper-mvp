name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests load e2e

      - name: Compile
        run: python -m compileall app load

      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Pytest failure"
              echo '```text'
              tail -n 160 pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: pip-audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Playwright E2E
        shell: bash
        run: |
          set -o pipefail
          pytest -q e2e --browser chromium 2>&1 | tee e2e-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Playwright E2E failure"
              echo '```text'
              tail -n 160 e2e-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
