<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Hi Jack Club{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  {% if request.session.get('authenticated') %}
  <header class="topbar">
    <a class="brand" href="/">Hi, Jack! <span>Helper</span></a>
    <nav>
      <a href="/clients">Клиенты</a>
      <a href="/clients/import">Импорт</a>
      <a href="/logs">Логи</a>
      {% if admin_role == 'master_admin' %}<a class="master-link" href="/master">Мастер</a>{% endif %}
    </nav>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link-button" type="submit">Выйти</button>
    </form>
  </header>
  {% endif %}
  <main class="container">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
